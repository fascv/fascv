[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "btc-news-arrow"
version = "0.1.0"
description = "Automated BTC news impact arrows from free feeds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0.11",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
llm = [
  "openai>=1.40.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
btcnews = "btc_news_arrow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

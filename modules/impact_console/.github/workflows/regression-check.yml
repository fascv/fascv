name: Regression Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

jobs:
  test-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run Tests
        run: pytest -q

      - name: Run Regression Gate
        run: |
          python -m btc_news_arrow regression-check \
            --baseline tools/regression_baseline.json \
            --bench-db /tmp/btcnews_regression_bench.db

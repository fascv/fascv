gate:
  safety_margin_bps: 1.0
  max_spread_bps: 12.0
  max_atr_bps: 300.0
risk:
  max_exposure_eur: 30.0
  vol_target_bps: 220.0
  cooldown_bars: 2
  allow_short: false
  use_vol_scaling: true
  use_gate_size_factor: true
  entry_edge_bps: 0.0
  exit_edge_bps: -4.0
  min_hold_bars: 6
  require_break_even_for_exit: true
  min_exit_profit_bps: 5.0
order:
  type: limit
  post_only: true
  limit_offset_bps: 0.5
  cycle_trade_eur: 30.0
alpha:
  type: auto
  auto:
    trend:
      lookback: 2
      threshold_bps: 12.0
      scale: 10.0
    mean_reversion:
      lookback: 4
      threshold_bps: 12.0
      scale: 1.0
      max_edge_bps: 40.0
    breakout:
      lookback: 20
      trigger_bps: 14.0
      scale: 1.0
      max_edge_bps: 100.0
    swing:
      lookback: 26
      buy_band: 0.3
      sell_band: 0.75
      momentum_lookback: 10
      reversal_threshold_bps: 3.0
      edge_scale: 1.0
      min_range_bps: 60.0
      max_edge_bps: 220.0
    regime:
      lookback: 8
      trend_momentum_bps: 8.0
      range_momentum_bps: 2.0
      high_vol_atr_bps: 120.0
      low_vol_atr_bps: 30.0
      breakout_return_bps: 12.0
      default_regime: range
      trend_strategy: trend
      range_strategy: mean_reversion
      breakout_strategy: breakout

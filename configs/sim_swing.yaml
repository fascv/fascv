general:
  starting_cash_eur: 150.0

data:
  default_micro:
    spread_bps: 8.0
    depth: 100000.0
    imbalance: 0.0

features:
  return_window: 1
  atr_window: 14
  volume_z_window: 20

cost:
  maker_fee_bps: 16.0
  taker_fee_bps: 26.0
  slippage_base_bps: 0.5
  slippage_vol_mult: 0.01
  spread_component_factor: 0.5

gate:
  safety_margin_bps: 0.25
  max_spread_bps: 16.0
  max_atr_bps: 250.0
  session_start_utc: 0
  session_end_utc: 24
  stale_seconds: 1800
  block_on_high_news_impact: false
  max_news_impact: 0.8
  max_news_age_sec: 1800
  news_safety_margin_bps: 0.0

alpha:
  type: swing
  # Tuned on 2026-02-17 14:30..19:10 UTC market swings (peaks/valleys).
  swing:
    lookback: 16
    buy_band: 0.55
    sell_band: 0.62
    momentum_lookback: 3
    reversal_threshold_bps: 0.05
    edge_scale: 6.0
    min_range_bps: 8.0
    max_edge_bps: 260.0

risk:
  max_exposure_eur: 20.0
  vol_target_bps: 120.0
  daily_loss_limit_eur: 8.0
  max_drawdown_pct: 10.0
  cooldown_bars: 4
  allow_short: false
  use_vol_scaling: false
  use_gate_size_factor: false
  entry_edge_bps: 1.5
  exit_edge_bps: -2.5
  min_hold_bars: 2
  require_break_even_for_exit: true
  min_exit_profit_bps: 2.0

order:
  type: market
  post_only: false
  limit_offset_bps: 2.0
  min_trade_btc: 0.00005
  slice_count: 1
  cycle_trade_eur: 20.0

execution:
  latency_bars: 0
  partial_fill_ratio: 1.0
  slippage_bps: 1.0

md:
  pair: BTC/EUR
  ws_url: wss://ws.kraken.com/v2
  stale_seconds: 10
  stale_book_seconds: 10
  stale_trade_seconds: 15
  reconnect_min: 1
  reconnect_max: 30
  depth: 100
  interval_seconds: 30

core:
  trading_enabled: true
  stale_seconds: 40
  max_orders_per_min: 12
  rate_limit_pause_sec: 2.0

exec:
  rate_limit_per_sec: 1.0
  reconcile_interval_sec: 30.0
  canary_mode: false
  deadman_timeout_sec: 60
  deadman_tick_sec: 20
  deadman_in_paper: false
  rate_limit_pause_sec: 2.0
  owntrades_dedupe_size: 50000

journal:
  db_path: logs/journal_sim_swing.db
  json_path: logs/journal_sim_swing.jsonl

ipc:
  market_queue_size: 1
  impact_queue_size: 1
  order_queue_size: 100
  exec_report_queue_size: 200
  journal_queue_size: 10000
  telemetry_queue_size: 1000
  heartbeat_queue_size: 1000
  heartbeat_timeout: 5.0

impact:
  enabled: true
  source: api
  symbol: BTC/EUR
  interval_seconds: 15
  timeout_seconds: 3
  api_url: "http://127.0.0.1:8011/signal/trading?window=1h&mode=auto"
  file_path: modules/impact_console/diagnostics/arrow_1h.json
  fallback_to_file: true

news:
  edge_scale_bps: 12.0
  block_long_entries: false
  risk_off_threshold: 0.2
  min_impact: 0.45

control:
  enabled: true
  host: 127.0.0.1
  port: 8000
  stale_warn_sec: 12

gate:
  safety_margin_bps: 0.25
  max_spread_bps: 20.0
  max_atr_bps: 400.0
risk:
  max_exposure_eur: 75.0
  vol_target_bps: 110.0
  cooldown_bars: 6
  allow_short: true
  use_vol_scaling: false
  use_gate_size_factor: true
  entry_edge_bps: 12.0
  exit_edge_bps: -4.0
  min_hold_bars: 16
  require_break_even_for_exit: true
  min_exit_profit_bps: 20.0
order:
  type: limit
  post_only: true
  limit_offset_bps: 5.0
  cycle_trade_eur: 75.0
alpha:
  type: auto
  auto:
    trend:
      lookback: 10
      threshold_bps: 6.0
      scale: 0.5
    mean_reversion:
      lookback: 4
      threshold_bps: 0.5
      scale: 1.0
      max_edge_bps: 0.0
    breakout:
      lookback: 16
      trigger_bps: 20.0
      scale: 3.0
      max_edge_bps: 150.0
    swing:
      lookback: 14
      buy_band: 0.4
      sell_band: 0.75
      momentum_lookback: 7
      reversal_threshold_bps: 3.0
      edge_scale: 1.0
      min_range_bps: 25.0
      max_edge_bps: 160.0
    regime:
      lookback: 10
      trend_momentum_bps: 30.0
      range_momentum_bps: 2.0
      high_vol_atr_bps: 100.0
      low_vol_atr_bps: 40.0
      breakout_return_bps: 10.0
      default_regime: trend
      trend_strategy: breakout
      range_strategy: mean_reversion
      breakout_strategy: trend

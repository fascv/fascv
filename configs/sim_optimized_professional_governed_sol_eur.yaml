gate:
  safety_margin_bps: 3.0
  max_spread_bps: 24.0
  max_atr_bps: 300.0
risk:
  max_exposure_eur: 10.0
  vol_target_bps: 180.0
  cooldown_bars: 6
  allow_short: true
  use_vol_scaling: false
  use_gate_size_factor: true
  entry_edge_bps: 60.0
  exit_edge_bps: 12.0
  min_hold_bars: 4
  require_break_even_for_exit: true
  min_exit_profit_bps: 20.0
order:
  type: limit
  post_only: true
  limit_offset_bps: 0.5
  cycle_trade_eur: 10.0
alpha:
  type: auto
  auto:
    trend:
      lookback: 2
      threshold_bps: 3.0
      scale: 3.0
    mean_reversion:
      lookback: 10
      threshold_bps: 6.0
      scale: 2.0
      max_edge_bps: 120.0
    breakout:
      lookback: 8
      trigger_bps: 3.0
      scale: 8.0
      max_edge_bps: 150.0
    swing:
      lookback: 26
      buy_band: 0.4
      sell_band: 0.65
      momentum_lookback: 5
      reversal_threshold_bps: 2.0
      edge_scale: 1.0
      min_range_bps: 25.0
      max_edge_bps: 110.0
    regime:
      lookback: 12
      trend_momentum_bps: 30.0
      range_momentum_bps: 1.0
      high_vol_atr_bps: 150.0
      low_vol_atr_bps: 60.0
      breakout_return_bps: 8.0
      default_regime: trend
      trend_strategy: trend
      range_strategy: swing
      breakout_strategy: breakout

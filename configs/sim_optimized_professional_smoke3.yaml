gate:
  safety_margin_bps: 0.5
  max_spread_bps: 8.0
  max_atr_bps: 160.0
risk:
  max_exposure_eur: 40.0
  vol_target_bps: 130.0
  cooldown_bars: 8
  allow_short: false
  use_vol_scaling: true
  use_gate_size_factor: true
  entry_edge_bps: 0.0
  exit_edge_bps: -2.0
  min_hold_bars: 0
  require_break_even_for_exit: true
  min_exit_profit_bps: 5.0
order:
  type: market
  post_only: false
  limit_offset_bps: 1.0
  cycle_trade_eur: 40.0
alpha:
  type: auto
  auto:
    trend:
      lookback: 5
      threshold_bps: 0.5
      scale: 2.0
    mean_reversion:
      lookback: 6
      threshold_bps: 1.5
      scale: 0.5
      max_edge_bps: 0.0
    breakout:
      lookback: 12
      trigger_bps: 10.0
      scale: 5.0
      max_edge_bps: 150.0
    swing:
      lookback: 14
      buy_band: 0.3
      sell_band: 0.7
      momentum_lookback: 10
      reversal_threshold_bps: 0.3
      edge_scale: 1.0
      min_range_bps: 40.0
      max_edge_bps: 110.0
    regime:
      lookback: 10
      trend_momentum_bps: 12.0
      range_momentum_bps: 6.0
      high_vol_atr_bps: 220.0
      low_vol_atr_bps: 40.0
      breakout_return_bps: 5.0
      default_regime: range
      trend_strategy: trend
      range_strategy: swing
      breakout_strategy: breakout

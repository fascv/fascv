gate:
  safety_margin_bps: 1.0
  max_spread_bps: 24.0
  max_atr_bps: 400.0
risk:
  max_exposure_eur: 30.0
  vol_target_bps: 220.0
  cooldown_bars: 3
  allow_short: false
  use_vol_scaling: true
  use_gate_size_factor: false
  entry_edge_bps: 20.0
  exit_edge_bps: -2.0
  min_hold_bars: 1
  require_break_even_for_exit: false
  min_exit_profit_bps: 30.0
order:
  type: limit
  post_only: true
  limit_offset_bps: 3.0
  cycle_trade_eur: 30.0
alpha:
  type: auto
  auto:
    trend:
      lookback: 10
      threshold_bps: 8.0
      scale: 8.0
    mean_reversion:
      lookback: 12
      threshold_bps: 2.0
      scale: 1.0
      max_edge_bps: 250.0
    breakout:
      lookback: 20
      trigger_bps: 30.0
      scale: 5.0
      max_edge_bps: 150.0
    swing:
      lookback: 22
      buy_band: 0.35
      sell_band: 0.65
      momentum_lookback: 5
      reversal_threshold_bps: 0.3
      edge_scale: 1.2
      min_range_bps: 25.0
      max_edge_bps: 110.0
    regime:
      lookback: 10
      trend_momentum_bps: 12.0
      range_momentum_bps: 4.0
      high_vol_atr_bps: 120.0
      low_vol_atr_bps: 60.0
      breakout_return_bps: 8.0
      default_regime: trend
      trend_strategy: breakout
      range_strategy: swing
      breakout_strategy: breakout
